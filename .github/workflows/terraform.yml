name: Terraform Jenkins Infrastructure

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      TF_VAR_ami_id: ${{ secrets.TF_VAR_AMI_ID }}
      TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Show Jenkins URLs
        run: |
          echo "=========================================="
          echo "       JENKINS DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Jenkins through Application Load Balancer:"
          echo "http://$(terraform output -raw load_balancer_dns)"

          echo ""
          echo "Jenkins EC2 Public IP:"
          echo "http://$(terraform output -raw jenkins_public_ip):8080"

          echo ""
          echo "Jenkins URL from Terraform:"
          terraform output -raw jenkins_url

          echo ""
          echo "Jenkins EC2 Instance ID:"
          terraform output -raw jenkins_instance_id

          echo ""
          echo "=========================================="